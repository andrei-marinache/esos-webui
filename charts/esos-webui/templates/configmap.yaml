apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "esos-webui.fullname" . }}
  labels:
    {{- include "esos-webui.labels" . | nindent 4 }}
data:
  NUXT_HOST: "0.0.0.0"
  NUXT_PORT: "3000"
  NITRO_HOST: "0.0.0.0"
  NITRO_PORT: "3000"
  NODE_ENV: "production"
  NUXT_SSH_HOST: {{ .Values.config.ssh.host | quote }}
  NUXT_SSH_PORT: {{ .Values.config.ssh.port | quote }}
  NUXT_SSH_USER: {{ .Values.config.ssh.user | quote }}
  DB_PATH: {{ .Values.config.dbPath | quote }}
  NUXT_COOKIE_SECURE: {{ .Values.config.cookieSecure | quote }}
  NUXT_PUBLIC_SSH_STATUS_POLL_MS: {{ .Values.config.sshStatusPollMs | quote }}
  SCST_CONF_PATH: {{ .Values.config.scstConfPath | quote }}
  SCST_SYSFS_PATH: {{ .Values.config.scstSysfsPath | quote }}
  {{- range $k, $v := .Values.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
