{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "esos-webui.fullname" . }}
  labels:
    {{- include "esos-webui.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.encryptionKey }}
  NUXT_ENCRYPTION_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.jwtSecret }}
  NUXT_JWT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.oidcStatePepper }}
  NUXT_OIDC_STATE_PEPPER: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubToken }}
  NUXT_GITHUB_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.sshPrivateKey }}
  NUXT_SSH_PRIVATE_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.sshPassword }}
  NUXT_SSH_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
